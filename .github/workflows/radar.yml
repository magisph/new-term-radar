name: Radar

on:
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * *'

jobs:
  run-radar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo do repositorio
        uses: actions/checkout@v4
      
      - name: Configurar o Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Rodar o Radar
        run: python -m radar daily --skip x,keyword_table --out report.md
        
      - name: Salvar o relatorio
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: report.md
